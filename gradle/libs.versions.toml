[versions]
android-compileSdk = "37"
android-compileSdkMinor = "1"
android-minSdk = "24"
android-targetSdk = "37"
agp = "9.4.1"
kotlin = "2.4.20"
kotlin-stdlib = "2.4.20"
ksp = "2.3.6"
junit = "4.13.2"

# AndroidX
appcompat = "1.8.0"
webkit = "1.17.1"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
coroutines-android = "1.11.0"
lifecycle-runtime-ktx = "2.11.0"
room = "2.8.5"

# Google
feature-delivery = "2.1.0"
# Empty jar so listenablefuture:1.0 does not clash with Guava's ListenableFuture.
guava-listenablefuture = "9999.0-empty-to-avoid-conflict-with-guava"
# Versions resolved by GeckoView. The base module must match them: R8 keeps the
# base copy of these libraries and drops the feature module's newer ones.
play-services-basement = "18.9.0"
play-services-tasks = "18.3.2"

# Third-party
robolectric = "4.17"
geckoview = "157.0.20261005135250"
ad-block = "0.0.4"
segmented-button = "v1.0.0"
pinned-section-listview = "1.0.0"

[libraries]
# build logic (buildSrc)
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# AndroidX
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }

# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin-stdlib" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines-android" }

# Google
google-feature-delivery = { group = "com.google.android.play", name = "feature-delivery", version.ref = "feature-delivery" }
google-feature-delivery-ktx = { group = "com.google.android.play", name = "feature-delivery-ktx", version.ref = "feature-delivery" }
guava-listenablefuture = { group = "com.google.guava", name = "listenablefuture", version.ref = "guava-listenablefuture" }
play-services-basement = { group = "com.google.android.gms", name = "play-services-basement", version.ref = "play-services-basement" }
play-services-tasks = { group = "com.google.android.gms", name = "play-services-tasks", version.ref = "play-services-tasks" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# Third-party
segmented-button = { group = "com.github.truefedex", name = "segmented-button", version.ref = "segmented-button" }
ad-block = { group = "com.github.truefedex", name = "ad-block", version.ref = "ad-block" }
pinned-section-listview = { group = "de.halfbit", name = "pinned-section-listview", version.ref = "pinned-section-listview" }

# Gecko
geckoview = { group = "org.mozilla.geckoview", name = "geckoview", version.ref = "geckoview" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
