<!DOCTYPE html>
<html>
<head>
    <title>TV Bro: Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
body {
    color:#343a3c;
    background-color:#EDF6FF;
}
@media (prefers-color-scheme: dark) {
    body {
        color:#f8f9fa;
        background-color:#343a3c;
    }    
}

#suggestions {
    width: 65vw;
    margin: auto;
    table-layout: fixed;
    outline: none;
    position: relative;
    top: 18vh;
    -webkit-border-horizontal-spacing: 1vw;
    -webkit-border-vertical-spacing: 2vh !important;
    border-spacing: 1vw;
}

td {
    overflow: hidden;
    white-space: nowrap;
    word-wrap: break-word;
    outline:none;
}

.sugg {
    padding: 1vh 1vw;
    white-space: nowrap;
    word-wrap: break-word;
    overflow: hidden;
    transition: .5s;
    color: #4F4F4F;
    background: #FFFFFF;
    box-shadow: 0px 1px 12px rgb(134 192 255 / 16%);
    border: 2px solid #FFFFFF;
    border-radius: 0.5vw;
}
@media (prefers-color-scheme: dark) {
    .sugg {
        color: #f8f9fa;
        background: #1e2122;
        box-shadow: 0px 1px 12px rgb(0 0 0 / 16%);
        border: 2px solid #343a3c;
    }
}
.sugg:hover {
    transition:.5s;
    background: #F3F6FA;
    border: 2px solid #A5D0FF;
    border-radius: 12px;
}
@media (prefers-color-scheme: dark) {
    .sugg:hover {
        background: #343a3c;
        border: 2px solid #A5D0FF;
        border-radius: 12px;
    }
}
.sugg:hover > div:nth-child(2) {
    color: #6666aa;
}
.sugg-ico {
    width: 4vw;
    float: left;
    color-scheme: only light;
}
.sugg-title {
    display: block;
    max-width: 90%;
    margin-left: 5vw;
    font-family: 'Roboto';
    font-style: normal;
    font-weight: 600;
    font-size: 1.3vw;
    line-height: 2.5vw;
    background-color: transparent;
}
.sugg-title.empty {
    background-color: #fcfcfc;
}
@media (prefers-color-scheme: dark) {
    .sugg-title.empty {
        background-color: #1f2425;
        border-radius: 12px;
    }
}
.ellipsize, .sugg-title, .sugg-desk{
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    max-width: 100%;
}
.sugg-desk {
    display: block;
    color: #BDBDBD;
    margin-left: 5vw;
    font-family: 'Roboto';
    font-style: normal;
    font-weight: 400;
    font-size: 1vw;
    line-height: 1.5vw;
    background-color: transparent;
}
@media (prefers-color-scheme: dark) {
    .sugg-desk {
        color: #f8f9fa;
    }
}
.sugg-desk.empty {
    background-color: #fafafa;
    border-radius: 12px;
}
@media (prefers-color-scheme: dark) {
    .sugg-desk.empty {
        background-color: #1f2425;
    }
}
.more {
    width: 1vw;
    float: right;
    margin-top: 1vh;
    cursor: pointer;
    display: none;
}
.logo {
    width: 10vw;
    height: 7.5vw;
    margin-top: 5vh;
    background-image: url("logo.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    position: absolute;
    color-scheme: only light;
}

.wrapper {
    position: relative;
    top: 15vh;
    width: 63vw;
    margin: auto;
}

.search_box{
    background: #fff;
    border-radius: 0.5vw;
    height: 3vw;
    display: flex;
    padding: 0.5vw;
    box-shadow: 0 8px 6px -10px #b3c6ff;
}
@media (prefers-color-scheme: dark) {
    .search_box{
        background: #1e2122;
        box-shadow: 0 8px 6px -10px #000000;
    }
}

.wrapper .search_box .dropdown{
  width: 7vw;
  border-right: 2px solid #dde2f1;
  color: #9fa3b1;
  position: relative;
  cursor: pointer;
}
@media (prefers-color-scheme: dark) {
    .wrapper .search_box .dropdown{
        border-right: 2px solid #343a3c;
        color: #f8f9fa;
    }
}

.wrapper .search_box .dropdown .default_option{
    display: block;
    background: url(favicons/google.png) no-repeat;
    width: 3vw;
    height: 3vw;
    margin-left: 1vw;
    background-size: 3vw;
    border: none;
}

.wrapper .search_box .dropdown ul{
    z-index: 1;
    position: absolute;
    font-size: 2vw;
    list-style-type: none;
    background: #fff;
    width: 16vw;
    border-radius: 0.5vw;
    padding: 1vw;
    display: none;
    box-shadow: 0.5vw 0.5vw 2vw -0.5vw #b3c6ff;
}
@media (prefers-color-scheme: dark) {
    .wrapper .search_box .dropdown ul{
        background: #1e2122;
        box-shadow: 0.5vw 0.5vw 2vw -0.5vw #000000;
    }
}

.wrapper .search_box .dropdown ul.active{
  display: block;
}

.wrapper .search_box .dropdown ul li{
  padding-bottom: 20px;
}

.wrapper .search_box .dropdown ul li img {
    width: 2vw;
    height: 2vw;
    display: block;
    float: left;
    margin-right: 0.5vw;
    color-scheme: only light;
}

.wrapper .search_box .dropdown ul li:last-child{
  padding-bottom: 0;
}

.wrapper .search_box .dropdown ul li:hover{
  color: #6f768d;
}

.wrapper .search_box .dropdown:before{
    content: "";
    position: absolute;
    top: 1.2vw;
    right: 1vw;
    border: 0.45vw solid;
    border-color: #5078ef transparent transparent transparent;
}

.wrapper .search_box .search_field{
  width: 100%;
  height: 100%;
  position: relative;
  display: flex;
}

.wrapper .search_box .search_field .input{
    width: 100%;
    height: 100%;
    border: 0px;
    font-size: 1.5vw;
    padding-left: 1vw;
    padding-right: 3vw;
    color: #6f768d;
    flex-grow: 1;
}
@media (prefers-color-scheme: dark) {
    .wrapper .search_box .search_field .input{
        color: #f8f9fa;
        background-color: #1e2122;
    }
}

.wrapper .search_box .search_field .fas{
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 22px;
  color: #5078ef;
  cursor: pointer;
}
@media (prefers-color-scheme: dark) {
    .wrapper .search_box .search_field .fas{
        color: #f8f9fa;
    }
}

.wrapper .search_box .search_action_container{
    border-left: 2px solid #dde2f1;
    width: 4vw;
    cursor: pointer;
    margin-left: 2px;
}
@media (prefers-color-scheme: dark) {
    .wrapper .search_box .search_action_container{
        border-left: 2px solid #343a3c;
    }
}

.wrapper .search_box .search_action_container .mic{
    width: 3vw;
    height: 2.4vw;
    margin: 0.3vw;
    background-image: url(mic.svg);
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}

.wrapper .search_box .search_action_container .lenz{
    width: 3vw;
    height: 2.4vw;
    margin: 0.3vw;
    background-image: url(search.svg);
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    display: none;
}

.wrapper .search_box .search_field .mode_toggle{
    height: 2.4vw;
    margin: 0.3vw 0 0.3vw 0.8vw;
    padding: 0 1.2vw;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3vw;
    line-height: 1;
    color: #5078ef;
    cursor: pointer;
    border: 2px solid #5078ef;
    border-radius: 1.2vw;
    white-space: nowrap;
    user-select: none;
}
@media (prefers-color-scheme: dark) {
    .wrapper .search_box .search_field .mode_toggle{
        color: #f8f9fa;
        border-color: #f8f9fa;
    }
}

.sections {
    width: 65vw;
    margin: auto;
    position: relative;
    top: 20vh;
    padding-bottom: 6vh;
}
.section {
    margin-bottom: 4vh;
}
.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0.5vw;
    margin-bottom: 1.5vh;
}
.section-title {
    font-family: 'Roboto';
    font-style: normal;
    font-weight: 700;
    font-size: 1.6vw;
    color: #5078ef;
}
.show-all {
    font-family: 'Roboto';
    font-size: 1.2vw;
    color: #5078ef;
    cursor: pointer;
    padding: 0.5vh 1vw;
    border-radius: 0.5vw;
    user-select: none;
    white-space: nowrap;
}
.show-all:hover {
    text-decoration: underline;
}
.show-all.hidden {
    visibility: hidden;
}
.section.hidden {
    display: none;
}
.grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: 2vw;
    row-gap: 2vh;
}
.sugg-cell {
    outline: none;
    cursor: pointer;
    min-width: 0;
    overflow: hidden;
}
@media (prefers-color-scheme: dark) {
    .section-title, .show-all {
        color: #f8f9fa;
    }
}

::-webkit-input-placeholder { /* Chrome/Opera/Safari */
    color: #9fa3b1;
}
::-moz-placeholder { /* Firefox 19+ */
    color: #9fa3b1;
}
    </style>
</head>
<body>
<div style="height: 100%; width: 100%; position: absolute; left: 0; top: 0; overflow-x: hidden;">
    <div class="logo"></div>
    <div class="wrapper">
        <div class="search_box">
            <div class="dropdown">
                <div class="default_option" onclick="onSearchEngineDropDownClick();"></div>  
                <ul id="search-engines-list">
                  <li onclick="applySearchEngine('google', null, true);"><img src="favicons/google.png" /> Google</li>
                  <li onclick="applySearchEngine('bing', null, true);"><img src="favicons/bing.png" /> Bing</li>
                  <li onclick="applySearchEngine('yahoo', null, true);"><img src="favicons/yahoo.png" /> Yahoo!</li>
                  <li onclick="applySearchEngine('ddg', null, true);"><img src="favicons/ddg.png" /> DuckDuckGo</li>
                  <li onclick="applySearchEngine('yandex', null, true);"><img src="favicons/yandex.png" /> Yandex</li>
                  <li onclick="applySearchEngine('startpage', null, true);"><img src="favicons/startpage.png" /> Startpage</li>
                  <li onclick="applySearchEngine('custom', promptCustomSearchEngineUrl(), true);"><img src="favicons/custom.png" /> Custom</li>
                </ul>
            </div>
            <div class="search_field">
                <input type="text" id="search-input" class="input" placeholder="Search">
                <div class="mode_toggle" id="mode-toggle" onclick="onModeToggleClick();">URL</div>
                <div class="search_action_container">
                    <div class="mic"></div>
                    <div class="lenz"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="sections">
        <div class="section" id="bookmarks-section">
            <div class="section-header">
                <span class="section-title">Bookmarks</span>
                <span class="show-all hidden" id="bookmarks-show-all" onclick="toggleBookmarksShowAll();"></span>
            </div>
            <div class="grid" id="bookmarks-grid"></div>
        </div>
        <div class="section" id="history-section">
            <div class="section-header">
                <span class="section-title">History</span>
            </div>
            <div class="grid" id="history-grid"></div>
        </div>
    </div>
</div>

<script>
var searchEngineUrlMap = {
        "google": "https://www.google.com/search?q=[query]",
        "bing": "https://www.bing.com/search?q=[query]",
        "yahoo": "https://search.yahoo.com/search?p=[query]",
        "ddg": "https://duckduckgo.com/?q=[query]",
        "yandex": "https://yandex.com/search/?text=[query]",
        "startpage": "https://www.startpage.com/sp/search?query=[query]",
        "custom": ""
    };
var bookmarksToDisplay = [];
var historyToDisplay = [];
var bookmarksExpanded = false;
var BOOKMARKS_COLLAPSED_COUNT = 6;

function onIcoLoadError(element) {
    element.src='ic_not_available.svg';
    element.style.filter = "invert(1)";
}

function loadRecommendations() {
    return [
        {"title": "Wikipedia - the free encyclopedia", "url":"https://www.wikipedia.org", "favicon": "https://ru.wikipedia.org/static/apple-touch/wikipedia.png"},
        {"title": "Reddit - Dive into anything", "url":"https://www.reddit.com", "favicon": "https://www.redditstatic.com/desktop2x/img/favicon/apple-icon-120x120.png"},
        {"title": "My Tuner", "url":"https://mytuner-radio.com/", "favicon": "https://static2.mytuner.mobi/static/icons/apple-touch-icon-120x120-precomposed.png"},
        {"title": "Instagram", "url":"https://www.instagram.com", "favicon": "https://static.cdninstagram.com/rsrc.php/v3/ys/r/aM-g435MtEX.png"},
        {"title": "IMDb", "url":"https://www.imdb.com/", "favicon": "https://m.media-amazon.com/images/G/01/imdb/images-ANDW73HA/favicon_iPhone_retina_180x180._CB1582158069_UX60_.png"},
        {"title": "eBay", "url":"https://www.ebay.com/", "favicon": "https://www.ebay.com/apple-touch-icon.png"},
        {"title": "Itch.io", "url":"https://itch.io/games/input-gamepad/platform-web", "favicon": "https://itch.io/static/images/itchio-square-144.png"},
        {"title": "BBC News", "url":"https://www.bbc.com/news", "favicon": "https://www.bbc.com/apple-touch-icon-120x120-precomposed.png"}
    ];
}

function faviconFor(link) {
    if (link.favicon) return link.favicon;
    try {
        var url = new URL(link.url);
        if (window.hasOwnProperty( "TVBro" )) {
            if (TVBro.requestFavicon) {
                //GeckoView
                TVBro.requestFavicon(link.url);
                return url.origin + "/favicon.ico";
            } else {
                //WebView
                return "favicon://" + url.host;
            }
        }
        return url.origin + "/favicon.ico";
    } catch (e) {
        console.log("Invalid URL: " + link.url);
        return "ic_not_available.svg";
    }
}

function createSuggCell(link, onMore) {
    var cell = document.createElement("div");
    cell.className = "sugg-cell";
    var box = document.createElement("div");
    box.className = "sugg";
    var ico = document.createElement("img");
    ico.className = "sugg-ico";
    ico.onerror = function() { onIcoLoadError(ico); };
    var more = document.createElement("img");
    more.src = "more.svg";
    more.className = "more";
    var title = document.createElement("div");
    title.className = "sugg-title";
    var desk = document.createElement("div");
    desk.className = "sugg-desk";
    box.appendChild(ico);
    box.appendChild(more);
    box.appendChild(title);
    box.appendChild(desk);
    cell.appendChild(box);
    if (link) {
        ico.src = faviconFor(link);
        title.innerHTML = link.title ? escapeHTML(link.title) : "&nbsp;";
        desk.innerHTML = link.description ? escapeHTML(link.description)
            : escapeHTML(link.url ? link.url : "");
        if (onMore) {
            more.style.display = "block";
            more.onclick = function(e) {
                e.stopPropagation();
                onMore(link);
            };
        }
        cell.onclick = function() {
            var url = link.dest_url ? link.dest_url : link.url;
            if (url) window.open(url, "_self");
        };
    } else {
        ico.src = "ic_not_available.svg";
        ico.style.filter = "invert(1)";
        title.innerHTML = "&nbsp;";
        desk.innerHTML = "&nbsp;";
        title.classList.add("empty");
        desk.classList.add("empty");
    }
    return cell;
}

function renderBookmarks() {
    var container = document.getElementById("bookmarks-grid");
    if (!container) return;
    var showAll = document.getElementById("bookmarks-show-all");
    container.innerHTML = "";
    var list = bookmarksExpanded ? bookmarksToDisplay
        : bookmarksToDisplay.slice(0, BOOKMARKS_COLLAPSED_COUNT);
    list.forEach(function(link) {
        var onMore = null;
        if (window.hasOwnProperty( "TVBro" ) && link.order !== undefined && link.order !== null) {
            onMore = function(l) { TVBro.onEditBookmark(l.favoriteId); };
        }
        container.appendChild(createSuggCell(link, onMore));
    });
    var section = document.getElementById("bookmarks-section");
    if (section) section.classList.toggle("hidden", bookmarksToDisplay.length === 0);
    if (showAll) {
        if (bookmarksToDisplay.length > BOOKMARKS_COLLAPSED_COUNT) {
            showAll.classList.remove("hidden");
            showAll.textContent = bookmarksExpanded
                ? "Show less" : ("Show all (" + bookmarksToDisplay.length + ")");
        } else {
            showAll.classList.add("hidden");
        }
    }
}

function toggleBookmarksShowAll() {
    bookmarksExpanded = !bookmarksExpanded;
    renderBookmarks();
}

function renderHistory() {
    var container = document.getElementById("history-grid");
    if (!container) return;
    container.innerHTML = "";
    historyToDisplay.forEach(function(link) {
        container.appendChild(createSuggCell(link, null));
    });
    var section = document.getElementById("history-section");
    if (section) section.classList.toggle("hidden", historyToDisplay.length === 0);
}

function renderSections(bookmarks, history) {
    bookmarksToDisplay = bookmarks ? bookmarks : [];
    historyToDisplay = history ? history : [];
    bookmarksExpanded = false;
    renderBookmarks();
    renderHistory();
}

function renderLinks(mode, linksArray) {
    //standalone usage (opened outside TVBro): show recommendations in the first section
    renderSections(linksArray ? linksArray : loadRecommendations(), []);
}

function onSearchEngineDropDownClick() {
    document.getElementById("search-engines-list").classList.toggle("active");
}

function promptCustomSearchEngineUrl() {
    var engine = localStorage.getItem("search-engine");
    var searchEngineUrl = localStorage.getItem("search-engine-url");
    searchEngineUrl = searchEngineUrl ? searchEngineUrl : searchEngineUrlMap[engine];

    return prompt("Enter search engine URL (with [query] as placeholder)", searchEngineUrl);
}

function applySearchEngine(engine, searchEngineUrl, notifyTVBro) {
    document.getElementById("search-engines-list").classList.remove("active");

    searchEngineUrl = searchEngineUrl ? searchEngineUrl : searchEngineUrlMap[engine];

    localStorage.setItem("search-engine", engine);
    localStorage.setItem("search-engine-url", searchEngineUrl);

    var iconUrl = "";
    if (engine == "custom") {
        var urlOrigin = new URL(searchEngineUrl.replace("[query]", "")).origin;
        iconUrl = "https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&size=120&url=" + urlOrigin;
    } else {
        iconUrl = "favicons/" + engine + ".png";
    }
    document.getElementsByClassName("default_option")[0].style.backgroundImage = "url('" + iconUrl + "')";    

    if (window.hasOwnProperty( "TVBro" ) && notifyTVBro) {
        TVBro.setSearchEngine(engine, searchEngineUrl ? searchEngineUrl : searchEngineUrlMap[engine]);
    }
}

function performSearch(text) {
    var searchEngineUrl = localStorage.getItem('search-engine-url') ? localStorage.getItem('search-engine-url') : searchEngineUrlMap['google'];
    var url = searchEngineUrl.replace("[query]", encodeURIComponent(text));
    window.open(url, "_self");
}

//When false the field works as an address bar (default); when true everything is treated as a search query.
var homePageSearchMode = false;

function looksLikeUrl(text) {
    text = text.trim();
    if (!text) return false;
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(text)) return true;
    if (/^(about|data|mailto|tel|javascript):/i.test(text)) return true;
    if (/\s/.test(text)) return false;
    var hostPart = text.split(/[\/?#]/)[0];
    if (hostPart.indexOf('.') !== -1) return true;
    if (hostPart === 'localhost') return true;
    if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?$/.test(hostPart)) return true;
    return false;
}

function normalizeUrl(text) {
    text = text.trim();
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(text)) return text;
    return "https://" + text;
}

function submitHomePageInput() {
    var input = document.getElementById("search-input");
    if (!input) return;
    var text = input.value;
    if (!text || !text.trim()) return;
    if (homePageSearchMode || !looksLikeUrl(text)) {
        performSearch(text);
    } else {
        window.open(normalizeUrl(text), "_self");
    }
}

function updateSearchInputUi() {
    var toggle = document.getElementById("mode-toggle");
    var input = document.getElementById("search-input");
    if (toggle) toggle.textContent = homePageSearchMode ? "Search" : "URL";
    if (input) input.placeholder = homePageSearchMode ? "Search" : "Enter address or search";
}

function onModeToggleClick() {
    homePageSearchMode = !homePageSearchMode;
    updateSearchInputUi();
    var input = document.getElementById("search-input");
    if (input) input.focus();
}

//callback called from TVBro/GeckoView
function onFaviconLoaded(url, data) {
    let imgElements = document.getElementsByTagName("img");
    for (let i = 0; i < imgElements.length; i++) {
        if (imgElements[i].src == "favicon://" + url) {
            imgElements[i].src = data;
        }
    }
}

function hideVoiceSearchUI() {
    document.getElementsByClassName("mic")[0].style.display = "none";
    document.getElementsByClassName("lenz")[0].style.display = "block";
}

//initialization

var escape = document.createElement('textarea');
function escapeHTML(html) {
    escape.textContent = html;
    return escape.innerHTML;
}

var searchEngine = localStorage.getItem('search-engine') ? localStorage.getItem('search-engine') : "google";
var searchEngineUrl = localStorage.getItem('search-engine-url') ? localStorage.getItem('search-engine-url') : searchEngineUrlMap[searchEngine];

document.getElementById("search-input").addEventListener("keydown", function(e) {
    if (e.keyCode == 13) {
        submitHomePageInput();
    }
});

document.getElementsByClassName("search_action_container")[0].onclick = function() {
    if (document.getElementsByClassName("mic")[0].style.display == "none") {
        submitHomePageInput();
    } else {
        if (window.hasOwnProperty( "TVBro" )) {
            TVBro.startVoiceSearch();
        }
    }
};

updateSearchInputUi();

//there are three modes this page can run in:
//1. Running inside ordinary web page - TVBro variable is not installed - no bookmarks, no voice search
//2. Running inside TVBro WebView - TVBro variable is installed
//3. Running inside TVBro GeckoView - TVBro variable is installed

if (window.hasOwnProperty( "TVBro" )) {
    console.log("Running inside TVBro");
    TVBro.onHomePageLoaded();
} else {
    hideVoiceSearchUI();
    applySearchEngine(searchEngine, searchEngineUrl, false);
    renderLinks();
}

</script>
</body>
</html>
