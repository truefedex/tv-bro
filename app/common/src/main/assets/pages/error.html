<!DOCTYPE html>
<html dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root {
    --bg-page: #EDF6FF;
    --surface: #FFFFFF;
    --control: #E6ECF4;
    --control-focused: #E8F4F9;
    --control-selected: #B7E5F6;
    --line: #CFDEEE;
    --focus: #A5D0FF;
    --ink: #4F4F4F;
    --icon: #60768E;
    --danger: #C5221F;
    --shadow: 0 4px 24px rgba(95, 172, 255, 0.12);
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg-page: #343A3C;
        --surface: #1B1B1B;
        --control: #323940;
        --control-focused: #003E4F;
        --control-selected: #5A5A5A;
        --line: #4E4E4E;
        --ink: #F8F9FA;
        --icon: #FDFDFD;
        --danger: #FF8A80;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }
}
html, body {
    margin: 0;
    min-height: 100%;
}
body {
    box-sizing: border-box;
    min-height: 100vh;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-page);
    color: var(--ink);
    font-family: Roboto, sans-serif;
    font-size: 14px;
    line-height: 20px;
}
[hidden] {
    display: none !important;
}
main {
    width: 100%;
    max-width: 600px;
    box-sizing: border-box;
    padding: 32px 36px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
}
.plate {
    width: 48px;
    height: 48px;
    border-radius: 24px;
    background: var(--control);
    display: flex;
    align-items: center;
    justify-content: center;
}
.plate svg {
    display: none;
    fill: var(--icon);
}
/* the glyph of each state: insecure, dangerous, crashed, network, generic */
[data-state="insecure"] .icon-insecure,
[data-state="dangerous"] .icon-dangerous,
[data-state="network"] .icon-network,
[data-state="crashed"] .icon-error,
[data-state="generic"] .icon-error {
    display: block;
}
[data-state="insecure"] .plate svg,
[data-state="dangerous"] .plate svg {
    fill: var(--danger);
}
h1 {
    margin: 20px 0 0;
    font-size: 24px;
    line-height: 30px;
    font-weight: 500;
}
p {
    margin: 8px 0 0;
}
dl {
    margin: 20px 0 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    column-gap: 16px;
    row-gap: 8px;
}
dl > div {
    display: contents;
}
dt {
    font-weight: 500;
}
dd {
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
dd.code {
    font: 12px/20px "Roboto Mono", monospace;
    unicode-bidi: plaintext;
}
.buttons {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}
button {
    height: 40px;
    padding: 0 18px;
    padding-inline-start: 14px;
    border: 0;
    border-radius: 6px;
    background: var(--control);
    color: var(--ink);
    font: 500 14px Roboto, sans-serif;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    outline: none;
}
button svg {
    flex: none;
    fill: var(--icon);
}
button:hover, button:focus {
    background: var(--control-focused);
    box-shadow: 0 0 0 1.5px var(--focus);
}
[dir="rtl"] .back-icon {
    transform: scaleX(-1);
}
@media (max-width: 600px) {
    body {
        padding: 0;
        align-items: stretch;
    }
    main {
        max-width: none;
        padding: 96px 24px 32px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: var(--bg-page);
        display: flex;
        flex-direction: column;
    }
    h1 {
        font-size: 22px;
        line-height: 28px;
    }
    dl {
        margin-top: 24px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
    }
    dl > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    dl > div + div {
        margin-top: 12px;
    }
    .buttons {
        margin-top: auto;
        padding-top: 28px;
        flex-direction: column;
    }
    button {
        width: 100%;
        height: 48px;
        font-size: 15px;
    }
    .buttons .primary {
        background: var(--control-selected);
    }
    button:focus:not(:focus-visible), button:hover {
        box-shadow: none;
    }
}
</style>
</head>
<body data-state="{{state}}">
<main>
    <div class="plate">
        <svg class="icon-insecure" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        <svg class="icon-dangerous" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.73 3H8.27L3 8.27v7.46L8.27 21h7.46L21 15.73V8.27L15.73 3zM12 17.3c-.72 0-1.3-.58-1.3-1.3 0-.72.58-1.3 1.3-1.3.72 0 1.3.58 1.3 1.3 0 .72-.58 1.3-1.3 1.3zm1-4.3h-2V7h2v6z"/></svg>
        <svg class="icon-network" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4c-1.48 0-2.85.43-4.01 1.17l1.46 1.46C10.21 6.23 11.08 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3 0 1.13-.64 2.11-1.56 2.62l1.45 1.45C23.16 18.16 24 16.68 24 15c0-2.64-2.05-4.78-4.65-4.96zM3 5.27l2.75 2.74C2.56 8.15 0 10.77 0 14c0 3.31 2.69 6 6 6h11.73l2 2L21 20.73 4.27 4 3 5.27zM7.73 10l8 8H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h1.73z"/></svg>
        <svg class="icon-error" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    </div>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
    <dl>
        <div id="hostname-row">
            <dt>{{hostnameLabel}}</dt>
            <dd id="hostname">{{hostname}}</dd>
        </div>
        <div>
            <dt>{{errorCodeLabel}}</dt>
            <dd class="code">{{errorCode}}</dd>
        </div>
    </dl>
    <div class="buttons">
        <button id="retry" type="button" data-url="{{url}}">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            {{retry}}
        </button>
        <button id="back" type="button" data-home="{{homeUrl}}">
            <svg class="back-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            {{back}}
        </button>
    </div>
</main>
<script>
//in a function: WebView writes the page over its own error page, whose globals stay
(function () {
    const state = document.body.dataset.state;
    const retry = document.getElementById("retry");
    const back = document.getElementById("back");

    document.getElementById("hostname-row").hidden = document.getElementById("hostname").textContent === "";
    //going on to a site that is not safe is not offered: going back is the only way out
    retry.hidden = state === "insecure" || state === "dangerous" || retry.dataset.url === "";
    const primary = retry.hidden ? back : retry;
    primary.classList.add("primary");

    retry.addEventListener("click", function () {
        location.replace(retry.dataset.url);
    });
    back.addEventListener("click", function () {
        if (history.length > 1) {
            history.back();
        } else {
            location.href = back.dataset.home;
        }
    });
    if (!matchMedia("(max-width: 600px)").matches) {
        primary.focus();
    }
    //WebView checks that the page took the place of its own
    window.TVBRO_errorPage = true;
})();
</script>
</body>
</html>
